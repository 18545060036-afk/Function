'<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单位圆与三角函数 · 全屏版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { background: #0b1120; font-family: system-ui, -apple-system, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }

  .controls {
    position: fixed; bottom: 26px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 12px; z-index: 10;
  }
  .btn {
    padding: 11px 30px; border: none; border-radius: 12px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    background: rgba(51, 65, 85, 0.85); color: #cbd5e1;
    transition: all 0.2s; backdrop-filter: blur(12px);
    letter-spacing: 0.3px;
  }
  .btn:hover { background: rgba(71, 85, 105, 0.9); color: #f1f5f9; }
  .btn.active {
    background: #3b82f6; color: #fff;
    box-shadow: 0 0 28px rgba(59, 130, 246, 0.55);
  }

  .hud {
    position: fixed; top: 22px; right: 26px;
    display: flex; flex-direction: column; gap: 7px;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 13px; padding: 16px 22px;
    background: rgba(15, 23, 42, 0.82);
    border: 1px solid rgba(51, 65, 85, 0.5);
    border-radius: 14px; backdrop-filter: blur(12px);
    z-index: 10; color: #94a3b8; min-width: 190px;
  }
  .hud .theta { color: #fbbf24; font-weight: 700; font-size: 15px; }
  .hud .sin { color: #60a5fa; }
  .hud .cos { color: #34d399; }
  .hud .tan { color: #f472b6; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="hud"></div>
<div class="controls">
  <button class="btn active" data-mode="basic">正弦 &amp; 余弦</button>
  <button class="btn" data-mode="tan">正切</button>
</div>

<script>
(function () {
  'use strict';

  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d');
  const hud    = document.getElementById('hud');
  const TAU    = Math.PI * 2;

  /* ───── 布局参数 ───── */
  let W, H, CX, CY, R;
  let SIN_X0, SIN_X1, SIN_W;
  let COS_Y0, COS_Y1, COS_H;

  /* ───── 状态 ───── */
  let theta = 0;
  let mode  = 'basic';
  const SPEED = 0.014;

  /* ───── 颜色 ───── */
  const C_SIN   = '#60a5fa';
  const C_COS   = '#34d399';
  const C_TAN   = '#f472b6';
  const C_AMBER = '#fbbf24';
  const C_AXIS  = '#334155';
  const C_TICK  = '#64748b';

  /* ───── 布局计算 ───── */
  function layout() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;

    const minDim = Math.min(W, H);
    R  = Math.max(55, Math.min(140, minDim * 0.12));
    CX = R + 85;
    CY = R + 85;

    SIN_X0 = CX + R;
    SIN_X1 = W - 70;
    SIN_W  = Math.max(120, SIN_X1 - SIN_X0);
    SIN_X1 = SIN_X0 + SIN_W;

    COS_Y0 = CY;
    COS_Y1 = H - 95;
    COS_H  = Math.max(120, COS_Y1 - COS_Y0);
    COS_Y1 = COS_Y0 + COS_H;
  }

  /* ───── 坐标映射 ───── */
  function xForTime(t)   { return SIN_X0 + (t / TAU) * SIN_W; }
  function yForTimeCos(t){ return COS_Y0 + (t / TAU) * COS_H; }

  /* ───── 背景网格 ───── */
  function drawBackground() {
    ctx.fillStyle = '#0b1120';
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = 'rgba(30, 41, 59, 0.55)';
    ctx.lineWidth = 1;
    const g = 40;
    ctx.beginPath();
    for (let x = 0; x <= W; x += g) {
      ctx.moveTo(x + 0.5, 0);
      ctx.lineTo(x + 0.5, H);
    }
    for (let y = 0; y <= H; y += g) {
      ctx.moveTo(0, y + 0.5);
      ctx.lineTo(W, y + 0.5);
    }
    ctx.stroke();
  }

  /* ───── 坐标轴 & 刻度 ───── */
  function drawAxes() {
    ctx.strokeStyle = C_AXIS;
    ctx.lineWidth = 1.5;

    // 水平轴（正弦 / 正切）
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.lineTo(SIN_X1 + 16, CY);
    ctx.stroke();

    // 垂直轴（余弦，仅正余弦模式）
    if (mode === 'basic') {
      ctx.beginPath();
      ctx.moveTo(CX, CY);
      ctx.lineTo(CX, COS_Y1 + 16);
      ctx.stroke();
    }

    ctx.font = '12px ui-monospace, monospace';
    const ticks  = [0, Math.PI / 2, Math.PI, Math.PI * 1.5, TAU];
    const labels = ['0', 'π/2', 'π', '3π/2', '2π'];

    /* 水平刻度 */
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';

    ticks.forEach((t, i) => {
      const x = xForTime(t);

      ctx.strokeStyle = C_TICK;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x, CY - 6);
      ctx.lineTo(x, CY + 6);
      ctx.stroke();

      ctx.save();
      ctx.setLineDash([3, 7]);
      ctx.strokeStyle = 'rgba(51, 65, 85, 0.35)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, CY - R - 25);
      ctx.lineTo(x, CY + R + 25);
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = '#94a3b8';
      ctx.fillText(labels[i], x, CY + 12);
    });

    /* 垂直刻度 */
    if (mode === 'basic') {
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';

      ticks.forEach((t, i) => {
        const y = yForTimeCos(t);

        ctx.strokeStyle = C_TICK;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(CX - 6, y);
        ctx.lineTo(CX + 6, y);
        ctx.stroke();

        ctx.save();
        ctx.setLineDash([3, 7]);
        ctx.strokeStyle = 'rgba(51, 65, 85, 0.35)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(CX - R - 25, y);
        ctx.lineTo(CX + R + 25, y);
        ctx.stroke();
        ctx.restore();

        ctx.fillStyle = '#94a3b8';
        ctx.fillText(labels[i], CX + 14, y);
      });
    }
  }

  /* ───── 正弦曲线 ───── */
  function drawSinCurve(untilT, alpha) {
    if (untilT <= 0.001 || alpha <= 0.01) return;
    const N = Math.max(40, Math.floor((untilT / TAU) * 700));
    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      const t = (i / N) * untilT;
      const x = xForTime(t);
      const y = CY - R * Math.sin(t);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = `rgba(96, 165, 250, ${alpha})`;
    ctx.lineWidth = alpha > 0.5 ? 2.5 : 1.3;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  /* ───── 余弦曲线 ───── */
  function drawCosCurve(untilT, alpha) {
    if (untilT <= 0.001 || alpha <= 0.01) return;
    const N = Math.max(40, Math.floor((untilT / TAU) * 700));
    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      const t = (i / N) * untilT;
      const y = yForTimeCos(t);
      const x = CX + R * Math.cos(t);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = `rgba(52, 211, 153, ${alpha})`;
    ctx.lineWidth = alpha > 0.5 ? 2.5 : 1.3;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  /* ───── 正切曲线 ───── */
  function drawTanCurve(untilT, alpha) {
    if (untilT <= 0.001 || alpha <= 0.01) return;
    const tanScale = R * 0.42;
    const CLIP = 3.4;
    const N = Math.max(80, Math.floor((untilT / TAU) * 1200));
    ctx.beginPath();
    let pen = false;

    for (let i = 0; i <= N; i++) {
      const t = (i / N) * untilT;
      const c = Math.cos(t);
      if (Math.abs(c) < 0.03) { pen = false; continue; }
      const v = Math.tan(t);
      if (Math.abs(v) > CLIP) { pen = false; continue; }
      const x = xForTime(t);
      const y = CY - v * tanScale;
      if (!pen) { ctx.moveTo(x, y); pen = true; }
      else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = `rgba(244, 114, 182, ${alpha})`;
    ctx.lineWidth = alpha > 0.5 ? 2.5 : 1.3;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  /* ───── 曲线组 ───── */
  function drawCurves() {
    if (mode === 'basic') {
      drawSinCurve(TAU, 0.12);
      drawCosCurve(TAU, 0.12);
      if (theta > 0.001) {
        drawSinCurve(theta, 0.95);
        drawCosCurve(theta, 0.95);
      }
    } else {
      drawTanCurve(TAU, 0.12);
      if (theta > 0.001) drawTanCurve(theta, 0.95);
    }
  }

  /* ───── 连接线（正余弦） ───── */
  function drawConnections() {
    if (mode !== 'basic') return;
    const cosV = Math.cos(theta);
    const sinV = Math.sin(theta);
    const px = CX + R * cosV;
    const py = CY - R * sinV;
    const xSin = xForTime(theta);
    const yCos = yForTimeCos(theta);

    ctx.save();
    ctx.setLineDash([6, 6]);
    ctx.lineWidth = 1.5;

    ctx.strokeStyle = 'rgba(96, 165, 250, 0.45)';
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(xSin, py);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(52, 211, 153, 0.45)';
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(px, yCos);
    ctx.stroke();

    ctx.restore();
  }

  /* ───── 【新增】正切：切线 + 延长线 ───── */
  function drawTanTangentLine() {
    const tx = CX + R;

    // 过 (1,0) 的垂直切线（贯穿全屏，暗示无限延伸）
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(tx, 0);
    ctx.lineTo(tx, H);
    ctx.strokeStyle = 'rgba(244, 114, 182, 0.22)';
    ctx.lineWidth = 2;
    ctx.setLineDash([9, 8]);
    ctx.stroke();
    ctx.restore();

    // 延长线：单位圆点 → 切线交点
    const cosV = Math.cos(theta);
    if (Math.abs(cosV) < 0.008) return;     // 极接近 π/2，跳过

    const tanV = Math.tan(theta);
    let ty = CY - R * tanV;
    // 防止极端坐标
    const BIG = 20000;
    ty = Math.max(-BIG, Math.min(BIG, ty));

    const px = CX + R * cosV;
    const py = CY - R * Math.sin(theta);

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(tx, ty);
    ctx.strokeStyle = 'rgba(251, 191, 36, 0.55)';
    ctx.lineWidth = 1.8;
    ctx.setLineDash([6, 6]);
    ctx.stroke();
    ctx.restore();
  }

  /* ───── 【新增】正切：切线交点 + 数值 ───── */
  function drawTanIntersection() {
    const cosV = Math.cos(theta);
    if (Math.abs(cosV) < 0.008) return;

    const tanV = Math.tan(theta);
    const ty = CY - R * tanV;
    const tx = CX + R;

    // 超出画布就不画点
    if (ty < 8 || ty > H - 8) return;

    ctx.save();
    ctx.beginPath();
    ctx.arc(tx, ty, 6.5, 0, TAU);
    ctx.fillStyle = C_TAN;
    ctx.shadowColor = C_TAN;
    ctx.shadowBlur = 18;
    ctx.fill();
    ctx.restore();

    // 交点旁标注 tan 值
    ctx.save();
    ctx.font = 'bold 13px ui-monospace, monospace';
    ctx.fillStyle = C_TAN;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(`tan = ${tanV.toFixed(2)}`, tx + 14, ty);
    ctx.restore();
  }

  /* ───── 单位圆 & 三角形 ───── */
  function drawUnitCircle() {
    const cosV = Math.cos(theta);
    const sinV = Math.sin(theta);
    const px = CX + R * cosV;
    const py = CY - R * sinV;

    ctx.beginPath();
    ctx.arc(CX, CY, R, 0, TAU);
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.35)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(CX, CY, 3, 0, TAU);
    ctx.fillStyle = '#64748b';
    ctx.fill();

    // cos 边
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.lineTo(px, CY);
    ctx.strokeStyle = C_COS;
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    ctx.stroke();

    // sin 边
    ctx.beginPath();
    ctx.moveTo(px, CY);
    ctx.lineTo(px, py);
    ctx.strokeStyle = C_SIN;
    ctx.lineWidth = 3.5;
    ctx.stroke();

    // 半径
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.lineTo(px, py);
    ctx.strokeStyle = 'rgba(251, 191, 36, 0.65)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 角度弧
    if (theta > 0.003) {
      ctx.beginPath();
      ctx.arc(CX, CY, R * 0.24, 0, -theta, true);
      ctx.strokeStyle = 'rgba(251, 191, 36, 0.8)';
      ctx.lineWidth = 1.8;
      ctx.stroke();
    }

    // 旋转点
    ctx.beginPath();
    ctx.arc(px, py, 6, 0, TAU);
    ctx.fillStyle = C_AMBER;
    ctx.shadowColor = C_AMBER;
    ctx.shadowBlur = 16;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  /* ───── 波上动点 ───── */
  function drawWaveDots() {
    if (mode === 'basic') {
      const xSin = xForTime(theta);
      const ySin = CY - R * Math.sin(theta);
      ctx.beginPath();
      ctx.arc(xSin, ySin, 6, 0, TAU);
      ctx.fillStyle = C_SIN;
      ctx.shadowColor = C_SIN;
      ctx.shadowBlur = 16;
      ctx.fill();

      const yCos = yForTimeCos(theta);
      const xCos = CX + R * Math.cos(theta);
      ctx.beginPath();
      ctx.arc(xCos, yCos, 6, 0, TAU);
      ctx.fillStyle = C_COS;
      ctx.shadowColor = C_COS;
      ctx.shadowBlur = 16;
      ctx.fill();
      ctx.shadowBlur = 0;
    } else {
      const c = Math.cos(theta);
      if (Math.abs(c) > 0.03) {
        const v = Math.tan(theta);
        if (Math.abs(v) <= 3.4) {
          const x = xForTime(theta);
          const y = CY - v * R * 0.42;
          ctx.beginPath();
          ctx.arc(x, y, 6, 0, TAU);
          ctx.fillStyle = C_TAN;
          ctx.shadowColor = C_TAN;
          ctx.shadowBlur = 16;
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      }
    }
  }

  /* ───── 文字标签 ───── */
  function drawLabels() {
    ctx.font = 'bold 14px ui-monospace, monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';

    if (mode === 'basic') {
      ctx.fillStyle = C_SIN;
      ctx.fillText('sin θ', SIN_X0 + 14, CY - R - 12);
      ctx.fillStyle = C_COS;
      ctx.fillText('cos θ', CX + R + 22, COS_Y0 + 26);
    } else {
      ctx.fillStyle = C_TAN;
      ctx.fillText('tan θ', SIN_X0 + 14, CY - R - 12);

      // 曲线压缩说明
      ctx.font = '11px ui-monospace, monospace';
      ctx.fillStyle = 'rgba(100, 116, 139, 0.8)';
      ctx.fillText('（纵向已压缩）', SIN_X0 + 14, CY - R + 28);

      // 切线标注
      ctx.font = '11px ui-monospace, monospace';
      ctx.fillStyle = 'rgba(244, 114, 182, 0.65)';
      ctx.textBaseline = 'top';
      ctx.fillText('切线 x = 1', CX + R + 9, 30);
    }

    // 圆内 sin / cos 标注
    const cosV = Math.cos(theta);
    const sinV = Math.sin(theta);
    const px = CX + R * cosV;
    const py = CY - R * sinV;

    ctx.font = 'bold 12px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const midCosX = (CX + px) / 2;
    const midCosY = CY + (sinV >= 0 ? 15 : -15);
    ctx.fillStyle = C_COS;
    ctx.fillText('cos', midCosX, midCosY);

    const midSinX = px + (cosV >= 0 ? 18 : -18);
    const midSinY = (CY + py) / 2;
    ctx.fillStyle = C_SIN;
    ctx.fillText('sin', midSinX, midSinY);
  }

  /* ───── HUD ───── */
  function updateHUD() {
    const deg = ((theta * 180) / Math.PI).toFixed(0);
    const sv  = Math.sin(theta);
    const cv  = Math.cos(theta);

    let html = `<div class="theta">θ = ${deg}°</div>`;

    if (mode === 'basic') {
      html += `<div class="sin">sin = ${sv >= 0 ? '\u00A0' : ''}${sv.toFixed(3)}</div>`;
      html += `<div class="cos">cos = ${cv >= 0 ? '\u00A0' : ''}${cv.toFixed(3)}</div>`;
    } else {
      const c = Math.cos(theta);
      let txt;
      if (Math.abs(c) < 0.02) {
        txt = 'tan → ±∞';
      } else {
        const v = Math.tan(theta);
        txt = `tan = ${v >= 0 ? '\u00A0' : ''}${Math.abs(v) > 99 ? (v > 0 ? '99.9+' : '-99.9+') : v.toFixed(3)}`;
      }
      html += `<div class="tan">${txt}</div>`;
    }

    hud.innerHTML = html;
  }

  /* ───── 主渲染 ───── */
  function render() {
    ctx.clearRect(0, 0, W, H);

    drawBackground();
    drawAxes();
    drawCurves();
    drawConnections();

    // 正切几何：切线和延长线先画（在圆底层）
    if (mode === 'tan') drawTanTangentLine();

    drawUnitCircle();

    // 正切交点后画（在上层）
    if (mode === 'tan') drawTanIntersection();

    drawWaveDots();
    drawLabels();
    updateHUD();
  }

  /* ───── 动画循环 ───── */
  function animate() {
    theta += SPEED;
    if (theta >= TAU) theta -= TAU;
    render();
    requestAnimationFrame(animate);
  }

  /* ───── 模式切换 ───── */
  function switchMode(newMode) {
    if (mode === newMode) return;
    mode = newMode;
    document.querySelectorAll('.btn').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === newMode);
    });
  }

  document.querySelectorAll('.btn').forEach(btn => {
    btn.addEventListener('click', () => switchMode(btn.dataset.mode));
  });

  window.addEventListener('resize', layout);

  layout();
  animate();

})();
</script>
</body>
</html>
