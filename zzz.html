<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>深空专注</title>
<style>
  :root {
    --bg: #020205;
    --text-main: #e0e0e0;
    --text-sub: rgba(255, 255, 255, 0.4);
    --accent: #00d2ff;
    --glass: rgba(255, 255, 255, 0.05);
    --glass-border: rgba(255, 255, 255, 0.1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%; font-family: -apple-system, sans-serif;
    background: var(--bg); color: var(--text-main); overflow: hidden;
  }

  /* 背景 Canvas */
  #space-bg { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
  
  /* 核心 UI 层 */
  .ui-layer {
    position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
    z-index: 10; display: flex; flex-direction: column; justify-content: space-between;
    padding: calc(30px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom));
    pointer-events: none; /* 让点击事件穿透到下面，除了特定按钮 */
  }

  /* 顶部状态栏 */
  .top-bar {
    display: flex; justify-content: space-between; align-items: center; pointer-events: auto;
  }
  .stat-box {
    background: var(--glass); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    border: 1px solid var(--glass-border); border-radius: 16px; padding: 10px 16px;
    font-size: 14px; color: var(--text-sub); display: flex; flex-direction: column; gap: 4px;
  }
  .stat-val { font-size: 18px; font-weight: bold; color: var(--accent); }
  .icon-btn {
    background: var(--glass); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    border: 1px solid var(--glass-border); border-radius: 50%; width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer;
    color: var(--text-main); transition: transform 0.2s;
  }
  .icon-btn:active { transform: scale(0.9); }

  /* 中央计时区 */
  .center-timer {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: auto; flex: 1;
  }
  .time-display {
    font-size: 84px; font-weight: 200; font-family: monospace;
    color: #fff; text-shadow: 0 0 30px rgba(0, 210, 255, 0.4);
    letter-spacing: -2px; margin-bottom: 20px; transition: all 0.3s;
  }
  .time-display.focusing { color: var(--accent); text-shadow: 0 0 50px rgba(0, 210, 255, 0.8); }

  /* 控制按钮 */
  .controls { display: flex; gap: 20px; margin-top: 30px; }
  .btn-main {
    background: rgba(0, 210, 255, 0.1); color: var(--accent); border: 1px solid var(--accent);
    padding: 15px 40px; border-radius: 30px; font-size: 18px; font-weight: bold;
    cursor: pointer; transition: all 0.3s; box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
  }
  .btn-main:active { transform: scale(0.95); background: rgba(0, 210, 255, 0.2); }
  .btn-main.stop { color: #ff3b30; border-color: #ff3b30; background: rgba(255, 59, 48, 0.1); box-shadow: 0 0 20px rgba(255,59,48,0.2); }

  /* 底部提示 */
  .bottom-hint { text-align: center; color: var(--text-sub); font-size: 12px; letter-spacing: 2px; }

  /* 弹窗面板 (设置与记录) */
  .modal {
    position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    z-index: 50; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s;
  }
  .modal.active { display: flex; opacity: 1; }
  .modal-content {
    background: #0a0a10; border: 1px solid var(--glass-border); border-radius: 24px;
    width: 90%; max-width: 400px; padding: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    position: relative;
  }
  .modal-title { margin: 0 0 20px 0; font-size: 20px; font-weight: bold; color: #fff; }
  .close-btn { position: absolute; top: 20px; right: 20px; font-size: 20px; color: var(--text-sub); cursor: pointer; }
  
  /* 时长选择器 */
  .preset-times { display: flex; gap: 10px; margin-bottom: 20px; }
  .preset { flex: 1; padding: 12px; border-radius: 12px; background: var(--glass); border: 1px solid var(--glass-border); color: #fff; text-align: center; cursor: pointer; }
  .preset.active { background: rgba(0, 210, 255, 0.2); border-color: var(--accent); color: var(--accent); }
  .custom-time { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; }
  .custom-time input {
    background: var(--glass); border: 1px solid var(--glass-border); color: #fff;
    padding: 10px; border-radius: 10px; font-size: 16px; width: 100%; outline: none; text-align: center;
  }

  /* 记录列表 */
  .history-list { max-height: 40vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .history-item {
    background: var(--glass); padding: 15px; border-radius: 12px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
  }
  .history-date { color: var(--text-sub); }
  .history-duration { color: var(--accent); font-weight: bold; font-size: 16px; }
  
  /* 星星标记（代表每次专注） */
  .star-mark { color: var(--accent); font-size: 12px; margin-right: 5px; }
</style>
</head>
<body>

<!-- 背景粒子动画 -->
<canvas id="space-bg"></canvas>

<!-- UI 层 -->
<div class="ui-layer">
  
  <!-- 顶部信息 -->
  <div class="top-bar">
    <div class="stat-box">
      <span>累计专注</span>
      <span class="stat-val" id="total-time">0 分钟</span>
    </div>
    <div class="icon-btn" onclick="openModal('history-modal')">📊</div>
  </div>

  <!-- 中央计时 -->
  <div class="center-timer">
    <div class="time-display" id="timer">25:00</div>
    <div class="controls">
      <button class="btn-main" id="main-btn" onclick="toggleTimer()">开始专注</button>
    </div>
  </div>

  <!-- 底部 -->
  <div class="bottom-hint" onclick="openModal('settings-modal')">
    设置时长 ⚙️
  </div>
</div>

<!-- 设置弹窗 -->
<div class="modal" id="settings-modal" onclick="closeModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="close-btn" onclick="closeModal(event)">×</div>
    <h2 class="modal-title">专注时长设置</h2>
    <div class="preset-times">
      <div class="preset" onclick="setTime(15, this)">15分</div>
      <div class="preset active" onclick="setTime(25, this)">25分</div>
      <div class="preset" onclick="setTime(45, this)">45分</div>
    </div>
    <div class="custom-time">
      <span>自定义(分钟):</span>
      <input type="number" id="custom-input" value="25" min="1" max="180" onchange="setCustomTime()">
    </div>
  </div>
</div>

<!-- 历史记录弹窗 -->
<div class="modal" id="history-modal" onclick="closeModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="close-btn" onclick="closeModal(event)">×</div>
    <h2 class="modal-title">深空星图记录</h2>
    <div class="history-list" id="history-list">
      <!-- 记录会动态插入这里 -->
    </div>
  </div>
</div>

<script>
  // ================= 核心数据与状态 =================
  let focusTime = 25 * 60; // 默认 25 分钟
  let remainingTime = focusTime;
  let isRunning = false;
  let timerInterval = null;
  let startTime = 0;
  let pausedTime = 0;

  // 从本地加载记录
  let historyData = JSON.parse(localStorage.getItem('deepSpaceFocusHistory')) || [];
  updateTotalTime();

  // 粒子系统变量
  let absorptionRate = 0; // 粒子吸收率（专注时变大）

  // ================= 计时器逻辑 =================
  const timerDisplay = document.getElementById('timer');
  const mainBtn = document.getElementById('main-btn');

  function formatTime(seconds) {
    const m = Math.floor(seconds / 60).toString().padStart(2, '0');
    const s = (seconds % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function updateDisplay() {
    timerDisplay.innerText = formatTime(remainingTime);
    document.title = `${formatTime(remainingTime)} - 深空专注`;
  }

  function setTime(mins, el) {
    if (isRunning) return; // 运行中不允许改
    document.querySelectorAll('.preset').forEach(p => p.classList.remove('active'));
    if(el) el.classList.add('active');
    document.getElementById('custom-input').value = mins;
    
    focusTime = mins * 60;
    remainingTime = focusTime;
    updateDisplay();
    closeModal();
  }

  function setCustomTime() {
    if (isRunning) return;
    let val = parseInt(document.getElementById('custom-input').value);
    if (isNaN(val) || val <= 0) val = 25;
    if (val > 180) val = 180;
    document.getElementById('custom-input').value = val;
    document.querySelectorAll('.preset').forEach(p => p.classList.remove('active'));
    
    focusTime = val * 60;
    remainingTime = focusTime;
    updateDisplay();
    closeModal();
  }

  function toggleTimer() {
    if (isRunning) {
      // 暂停
      clearInterval(timerInterval);
      isRunning = false;
      pausedTime = Date.now();
      mainBtn.innerText = "继续专注";
      mainBtn.classList.remove('stop');
      timerDisplay.classList.remove('focusing');
      absorptionRate = 0;
    } else {
      // 开始 / 继续
      isRunning = true;
      startTime = Date.now() - (focusTime - remainingTime) * 1000; // 兼容暂停后继续
      mainBtn.innerText = "放弃专注";
      mainBtn.classList.add('stop');
      timerDisplay.classList.add('focusing');
      absorptionRate = 1;
      
      timerInterval = setInterval(() => {
        const now = Date.now();
        const elapsed = Math.floor((now - startTime) / 1000);
        remainingTime = focusTime - elapsed;

        if (remainingTime <= 0) {
          completeFocus();
        } else {
          updateDisplay();
        }
      }, 1000);
    }
  }

  function completeFocus() {
    clearInterval(timerInterval);
    isRunning = false;
    absorptionRate = 3; // 粒子爆炸式吸入
    
    // 震动与音效（若支持）
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    playSuccessSound();
    
    // 保存记录
    const durationMins = Math.floor(focusTime / 60);
    const record = {
      date: new Date().toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
      duration: durationMins
    };
    historyData.unshift(record);
    localStorage.setItem('deepSpaceFocusHistory', JSON.stringify(historyData));
    updateTotalTime();

    alert(`🎉 专注完成！你在宇宙中点亮了一颗星辰。\n本次专注：${durationMins} 分钟`);
    
    // 重置
    remainingTime = focusTime;
    updateDisplay();
    mainBtn.innerText = "开始专注";
    mainBtn.classList.remove('stop');
    timerDisplay.classList.remove('focusing');
    absorptionRate = 0.2;
  }

  function updateTotalTime() {
    const total = historyData.reduce((sum, item) => sum + item.duration, 0);
    document.getElementById('total-time').innerText = total > 60 
      ? `${(total / 60).toFixed(1)} 小时` 
      : `${total} 分钟`;
      
    // 更新历史列表
    const listEl = document.getElementById('history-list');
    if (historyData.length === 0) {
      listEl.innerHTML = '<div style="color:#666;text-align:center;padding:20px;">还没有记录，快去点亮第一颗星吧！</div>';
    } else {
      listEl.innerHTML = historyData.map(item => `
        <div class="history-item">
          <div><span class="star-mark">✦</span><span class="history-date">${item.date}</span></div>
          <div class="history-duration">${item.duration} 分钟</div>
        </div>
      `).join('');
    }
  }

  // 简单的提示音
  function playSuccessSound() {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
      osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.5); // C6
      gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 1);
    } catch(e) {}
  }

  // 弹窗逻辑
  function openModal(id) {
    if (isRunning) return alert("专注期间请保持专注，结束后再操作哦！");
    document.getElementById(id).classList.add('active');
  }
  function closeModal(e) {
    if(e) e.stopPropagation();
    document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
  }

  // ================= 深邃星空 & 引力粒子特效 =================
  const canvas = document.getElementById('space-bg');
  const ctx = canvas.getContext('2d');
  let W, H, cx, cy;
  let particles = [];
  
  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * window.devicePixelRatio;
    canvas.height = H * window.devicePixelRatio;
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    cx = W / 2;
    cy = H / 2;
    initParticles();
  }
  window.addEventListener('resize', resize);

  function initParticles() {
    particles = [];
    const numParticles = 400; // 粒子数量
    for (let i = 0; i < numParticles; i++) {
      // 极坐标生成
      const angle = Math.random() * Math.PI * 2;
      const distance = Math.random() * Math.max(W, H) * 0.8 + 100;
      particles.push({
        angle: angle,
        dist: distance,
        speed: Math.random() * 0.02 + 0.005, // 旋转速度
        size: Math.random() * 1.5 + 0.5,
        alpha: Math.random() * 0.5 + 0.2,
        color: Math.random() > 0.9 ? '#00d2ff' : (Math.random() > 0.5 ? '#ffffff' : '#a0a0ff')
      });
    }
  }

  let time = 0;
  function draw() {
    // 清屏（深空背景色）
    ctx.fillStyle = 'rgba(2, 2, 5, 0.4)'; // 拖尾效果
    ctx.fillRect(0, 0, W, H);

    time += 0.01;

    // 绘制引力核心（中央天体的光晕）
    const coreRadius = 50 + Math.sin(time * 2) * 10; // 呼吸效果
    const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreRadius * 2.5);
    gradient.addColorStop(0, 'rgba(0, 210, 255, 0.15)');
    gradient.addColorStop(0.5, 'rgba(0, 210, 255, 0.05)');
    gradient.addColorStop(1, 'rgba(2, 2, 5, 0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(cx, cy, coreRadius * 2.5, 0, Math.PI * 2);
    ctx.fill();

    // 绘制粒子
    particles.forEach(p => {
      // 旋转
      p.angle += p.speed;
      
      // 引力吸收逻辑（专注时向中心靠拢）
      if (absorptionRate > 0) {
        p.dist -= absorptionRate * 0.8;
      } else {
        // 未专注时缓慢漂移
        p.dist += Math.sin(time + p.angle) * 0.1;
      }

      // 如果太靠近中心，或者太远，重置
      if (p.dist < 20) {
        p.dist = Math.max(W, H) * 0.8 + Math.random() * 200;
        p.angle = Math.random() * Math.PI * 2;
      } else if (p.dist > Math.max(W, H)) {
        p.dist = Math.max(W, H) * 0.8; // 限制最大距离
      }

      // 计算笛卡尔坐标
      const x = cx + Math.cos(p.angle) * p.dist;
      const y = cy + Math.sin(p.angle) * p.dist * 0.6; // 椭圆透视，看起来像星系盘

      // 绘制粒子
      ctx.beginPath();
      ctx.arc(x, y, p.size, 0, Math.PI * 2);
      
      // 越靠近中心越亮
      const brightness = Math.max(0.1, 1 - p.dist / (Math.max(W, H) * 0.8));
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.alpha * (0.3 + brightness * 0.7);
      ctx.fill();

      // 拖尾特效（专注时更明显）
      if (absorptionRate > 0) {
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(cx + Math.cos(p.angle - 0.1) * p.dist, cy + Math.sin(p.angle - 0.1) * p.dist * 0.6);
        ctx.strokeStyle = p.color;
        ctx.lineWidth = p.size * 0.5;
        ctx.globalAlpha = ctx.globalAlpha * 0.5;
        ctx.stroke();
      }
    });
    ctx.globalAlpha = 1;

    requestAnimationFrame(draw);
  }

  // 初始化
  resize();
  draw();
  updateDisplay();
  absorptionRate = 0.2; // 初始轻微漂移
</script>
</body>
</html>
