<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>数学神器 Liquid</title>
<link rel="apple-touch-icon" href="icon.png"> 
<style>
  :root {
    --glass-bg: rgba(255, 255, 255, 0.45); 
    --glass-border: rgba(255, 255, 255, 0.9);
    --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15), inset 0 1px 1px 0 rgba(255,255,255,1), inset 0 -1px 1px 0 rgba(255,255,255,0.4);
  }
  
  html,body {
    margin: 0; padding: 0; height: 100%; overflow: hidden; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #e0e5ec;
    background-image: 
      radial-gradient(circle at 10% 20%, rgba(255, 150, 150, 0.7), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(130, 200, 255, 0.7), transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(180, 240, 160, 0.6), transparent 50%);
    background-size: 150% 150%;
  }

  canvas { 
    display: block; width: 100vw; height: 100vh; touch-action: none; 
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  #c2d { background: rgba(255, 255, 255, 0.65); }
  #c3d { background: rgba(248, 249, 250, 0.65); display: none; }

  /* === 核心修改：悬浮面板 === */
  .glass-panel {
    position: fixed; 
    top: calc(12px + env(safe-area-inset-top)); 
    left: 12px;
    width: 320px; /* 默认宽度 */
    height: 520px;
    min-width: 250px;
    min-height: 250px;
    max-width: 95vw;
    max-height: 90vh;
    z-index: 20;
    
    background: var(--glass-bg);
    backdrop-filter: blur(35px) saturate(180%); 
    -webkit-backdrop-filter: blur(35px) saturate(180%);
    border: 1px solid var(--glass-border); 
    border-radius: 24px;
    box-shadow: var(--glass-shadow);
    padding: 12px; 
    display: flex; flex-direction: column; gap: 10px;
    
    transition: transform .3s cubic-bezier(0.25, 1, 0.5, 1), opacity .3s;
    overflow-y: auto; 
    /* 阻止系统默认手势，让自定义拖拽丝滑 */
    touch-action: none; 
  }
  .glass-panel.hidden { transform: translateY(-120%); opacity: 0; pointer-events: none; }

  /* 右下角缩放控制柄 */
  .resize-handle {
    position: absolute; right: 0; bottom: 0; width: 40px; height: 40px;
    cursor: nwse-resize; z-index: 50;
    background: linear-gradient(135deg, transparent 50%, rgba(0, 0, 0, 0.15) 50%);
    border-bottom-right-radius: 24px;
    touch-action: none;
  }
  /* 顶部拖拽提示区 */
  .drag-bar {
    height: 20px; margin: -12px -12px 5px -12px; 
    cursor: grab; border-top-left-radius: 24px; border-top-right-radius: 24px;
    touch-action: none;
  }
  .drag-bar:active { cursor: grabbing; }

  .tabs { display: flex; background: rgba(0,0,0,0.04); border-radius: 14px; padding: 4px; gap: 4px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.05); flex-shrink: 0; }
  .tab { flex: 1; text-align: center; padding: 8px 0; border-radius: 10px; font-size: 14px; font-weight: 600; color: #555; cursor: pointer; transition: all .2s; }
  .tab.active { 
    background: rgba(255,255,255,0.8); color: #007aff; 
    box-shadow: 0 2px 8px rgba(0,0,0,0.08), inset 0 1px 1px rgba(255,255,255,1); 
    border: 1px solid rgba(255,255,255,0.5);
  }

  .tab-content { display: none; flex-direction: column; gap: 8px; flex: 1; }
  .tab-content.active { display: flex; }

  textarea { 
    width: 100%; box-sizing: border-box; font-size: 15px; font-family: ui-monospace, Menlo, monospace; 
    padding: 12px; border: 1px solid rgba(255,255,255,0.8); border-radius: 14px; resize: none; height: 80px; 
    background: rgba(255,255,255,0.5); box-shadow: inset 0 2px 5px rgba(0,0,0,0.03);
    color: #111; flex-shrink: 0; touch-action: auto;
  }
  textarea:focus { outline: none; border-color: #007aff; background: rgba(255,255,255,0.8); }

  .range-inputs { display: flex; gap: 8px; align-items: center; font-size: 13px; color: #333; flex-wrap: wrap; flex-shrink: 0; }
  .range-inputs input { width: 45px; padding: 6px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.8); background: rgba(255,255,255,0.6); text-align: center; font-size: 13px; }

  #sliders2d { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
  .slider-row { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.4); border: 1px solid rgba(255,255,255,0.6); padding: 6px 12px; border-radius: 10px; }
  .slider-label { font-weight: bold; width: 15px; }
  .slider-val { color: #007aff; width: 40px; text-align: right; font-weight: 600; font-size: 13px; }
  input[type=range] { flex: 1; accent-color: #007aff; height: 20px; touch-action: auto; }
  
  #keypad { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; flex-shrink: 0; touch-action: pan-x; }
  #keypad::-webkit-scrollbar { display: none; }
  .key { 
    background: rgba(255,255,255,0.6); color: #007aff; border: 1px solid rgba(255,255,255,0.9); 
    border-radius: 10px; padding: 8px 14px; font-size: 15px; font-weight: 600; white-space: nowrap; 
    box-shadow: 0 2px 5px rgba(0,0,0,0.05), inset 0 1px 1px rgba(255,255,255,1);
  }
  .key:active { background: rgba(200,200,200,0.5); transform: scale(0.95); }

  .calc-screen { 
    background: rgba(255,255,255,0.6); border-radius: 14px; padding: 15px; text-align: right; 
    font-size: 32px; font-weight: 500; min-height: 45px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
    border: 1px solid rgba(255,255,255,0.8); flex-shrink: 0;
  }
  .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; flex: 1; }
  .calc-btn { 
    background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.8); 
    border-radius: 14px; padding: 15px 0; font-size: 20px; font-weight: 500; color: #333;
    box-shadow: 0 2px 5px rgba(0,0,0,0.03), inset 0 1px 1px rgba(255,255,255,1);
  }
  .calc-btn:active { background: rgba(200,200,200,0.6); }
  .calc-btn.op { color: #007aff; background: rgba(230, 240, 255, 0.6); }
  .calc-btn.eq { background: #007aff; color: #fff; box-shadow: 0 4px 10px rgba(0,122,255,0.3); }

  .mod-row { display: flex; gap: 10px; margin-bottom: 8px; align-items: center; flex-shrink: 0; }
  .mod-input { 
    flex: 1; font-size: 20px; padding: 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.8); 
    text-align: center; font-weight: 600; background: rgba(255,255,255,0.5); box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
  }
  .mod-result { 
    background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.9); border-radius: 16px; 
    padding: 15px; display: flex; justify-content: space-around; box-shadow: inset 0 1px 1px rgba(255,255,255,1);
    flex-shrink: 0;
  }
  .mod-res-value { font-size: 28px; font-weight: bold; color: #007aff; }

  .row { display: flex; gap: 8px; align-items: center; margin-top: 4px; flex-shrink: 0; }
  .btn { 
    flex: 1; font-size: 15px; padding: 12px; border: 1px solid rgba(255,255,255,0.9); border-radius: 14px; 
    background: #007aff; color: #fff; font-weight: 600; box-shadow: 0 4px 12px rgba(0,122,255,0.3), inset 0 1px 1px rgba(255,255,255,0.4);
  }
  .btn:active { transform: scale(0.98); }
  .btn.sec { background: rgba(255,255,255,0.6); color: #007aff; box-shadow: 0 2px 8px rgba(0,0,0,0.05), inset 0 1px 1px rgba(255,255,255,1); }
  
  #toggle { 
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 30; 
    width: 56px; height: 56px; border-radius: 28px; 
    border: 1px solid var(--glass-border); 
    background: var(--glass-bg); 
    backdrop-filter: blur(25px) saturate(150%); -webkit-backdrop-filter: blur(25px) saturate(150%); 
    color: #007aff; font-size: 26px; display: flex; align-items: center; justify-content: center; 
    box-shadow: var(--glass-shadow); transition: transform 0.2s; 
  }
  #toggle:active { transform: scale(0.9); }
  
  #msg { 
    position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 10; 
    background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); color: #fff; 
    font-size: 13px; padding: 10px 16px; border-radius: 12px; pointer-events: none; 
    border: 1px solid rgba(255,255,255,0.2);
  }
</style>
</head>
<body>
<canvas id="c2d"></canvas>
<canvas id="c3d"></canvas>

<div id="panel" class="glass-panel">
  <!-- 拖拽条 -->
  <div class="drag-bar" id="drag-bar"></div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('graph', this)">📈 2D画板</div>
    <div class="tab" onclick="switchTab('3d', this)">🧊 3D曲面</div>
    <div class="tab" onclick="switchTab('calc', this)">🧮 计算器</div>
    <div class="tab" onclick="switchTab('mod', this)">➗ 余数</div>
  </div>

  <!-- 2D 画板 -->
  <div id="tab-graph" class="tab-content active">
    <textarea id="expr2d" spellcheck="false">y = a * x^2 - 2
y = 2x + 1
y = sin(x)</textarea>
    <div class="range-inputs">
      <span>定义域:</span>
      <input type="number" id="dom-min" placeholder="min" value="">
      <span>~</span>
      <input type="number" id="dom-max" placeholder="max" value="">
      <span>值域:</span>
      <input type="number" id="ran-min" placeholder="min" value="">
      <span>~</span>
      <input type="number" id="ran-max" placeholder="max" value="">
    </div>
    <div id="sliders2d"></div>
    <div id="keypad">
      <button class="key" onclick="insertStr('expr2d', 'x')">x</button>
      <button class="key" onclick="insertStr('expr2d', '^')">^</button>
      <button class="key" onclick="insertStr('expr2d', 'sin(')">sin(</button>
      <button class="key" onclick="insertStr('expr2d', 'cos(')">cos(</button>
      <button class="key" onclick="insertStr('expr2d', 'sqrt(')">√</button>
      <button class="key" onclick="insertStr('expr2d', 'π')">π</button>
      <button class="key" onclick="insertStr('expr2d', 'a')">a</button>
    </div>
    <div class="row">
      <button class="btn" id="drawBtn">绘制 & 求交点</button>
      <button class="btn sec" id="resetBtn">复位视图</button>
    </div>
  </div>

  <!-- 3D 曲面 -->
  <div id="tab-3d" class="tab-content">
    <textarea id="expr3d" spellcheck="false">z = sin(x) * cos(y)</textarea>
    <div class="row">
      <button class="btn" id="draw3dBtn">生成 3D 曲面</button>
      <button class="btn sec" onclick="reset3D()">复位视角</button>
    </div>
    <div style="font-size:12px; color:#555; margin-top:5px; text-align:center;">* 单指拖动旋转，双指捏合缩放</div>
  </div>

  <!-- 计算器 -->
  <div id="tab-calc" class="tab-content">
    <div class="calc-screen" id="calc-screen">0</div>
    <div class="calc-grid">
      <button class="calc-btn op" onclick="calcInput('C')">C</button>
      <button class="calc-btn op" onclick="calcInput('(')">(</button>
      <button class="calc-btn op" onclick="calcInput(')')">)</button>
      <button class="calc-btn op" onclick="calcInput('/')">÷</button>
      <button class="calc-btn" onclick="calcInput('7')">7</button>
      <button class="calc-btn" onclick="calcInput('8')">8</button>
      <button class="calc-btn" onclick="calcInput('9')">9</button>
      <button class="calc-btn op" onclick="calcInput('*')">×</button>
      <button class="calc-btn" onclick="calcInput('4')">4</button>
      <button class="calc-btn" onclick="calcInput('5')">5</button>
      <button class="calc-btn" onclick="calcInput('6')">6</button>
      <button class="calc-btn op" onclick="calcInput('-')">-</button>
      <button class="calc-btn" onclick="calcInput('1')">1</button>
      <button class="calc-btn" onclick="calcInput('2')">2</button>
      <button class="calc-btn" onclick="calcInput('3')">3</button>
      <button class="calc-btn op" onclick="calcInput('+')">+</button>
      <button class="calc-btn" onclick="calcInput('0')">0</button>
      <button class="calc-btn" onclick="calcInput('.')">.</button>
      <button class="calc-btn op" onclick="calcInput('sin(')">sin</button>
      <button class="calc-btn eq" onclick="calcEquals()">=</button>
    </div>
  </div>

  <!-- 余数计算器 -->
  <div id="tab-mod" class="tab-content">
    <div class="mod-row">
      <input type="number" id="mod-dividend" class="mod-input" value="400" oninput="calcMod()">
      <span style="font-size:24px; font-weight:bold; color:#555;">÷</span>
      <input type="number" id="mod-divisor" class="mod-input" value="360" oninput="calcMod()">
    </div>
    <div style="display:flex; gap:8px; margin-top:4px;">
      <button class="btn sec" onclick="setMod(360)">360°</button>
      <button class="btn sec" onclick="setMod(180)">180°</button>
      <button class="btn sec" onclick="setMod(90)">90°</button>
    </div>
    <div class="mod-result">
      <div><span style="font-size:13px;color:#666">商</span><br><span class="mod-res-value" id="mod-q">1</span></div>
      <div><span style="font-size:13px;color:#666">余数</span><br><span class="mod-res-value" id="mod-r" style="color:#ff3b30">40</span></div>
    </div>
  </div>

  <div class="resize-handle" id="resize-handle"></div>
</div>

<button id="toggle" onclick="document.getElementById('panel').classList.toggle('hidden'); setTimeout(resizeAll, 300);">☰</button>
<div id="msg">就绪</div>

<script>
// === 修复后的面板拖拽和缩放逻辑 ===
const panel = document.getElementById('panel');
const dragBar = document.getElementById('drag-bar');
const resizeHandle = document.getElementById('resize-handle');

let isDragging = false;
let isResizing = false;
let startX, startY, startLeft, startTop, startWidth, startHeight;

dragBar.addEventListener('touchstart', (e) => {
  isDragging = true;
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
  startLeft = panel.offsetLeft;
  startTop = panel.offsetTop;
  e.preventDefault();
}, {passive: false});

resizeHandle.addEventListener('touchstart', (e) => {
  isResizing = true;
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
  startWidth = panel.offsetWidth;
  startHeight = panel.offsetHeight;
  e.stopPropagation();
  e.preventDefault();
}, {passive: false});

document.addEventListener('touchmove', (e) => {
  if (isDragging) {
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    
    // 限制拖出屏幕边缘
    let newLeft = Math.max(10, Math.min(window.innerWidth - panel.offsetWidth - 10, startLeft + dx));
    let newTop = Math.max(10, Math.min(window.innerHeight - panel.offsetHeight - 10, startTop + dy));
    panel.style.left = newLeft + 'px';
    panel.style.top = newTop + 'px';
    panel.style.bottom = 'auto'; // 解除默认底部定位
    panel.style.right = 'auto';
  } else if (isResizing) {
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    
    // 限制最小尺寸，且不能超出屏幕右侧和底部
    let maxW = window.innerWidth - panel.offsetLeft - 10;
    let maxH = window.innerHeight - panel.offsetTop - 10;
    
    let newW = Math.max(250, Math.min(maxW, startWidth + dx));
    let newH = Math.max(250, Math.min(maxH, startHeight + dy));
    
    panel.style.width = newW + 'px';
    panel.style.height = newH + 'px';
  }
}, {passive: false});

document.addEventListener('touchend', () => {
  isDragging = false;
  isResizing = false;
});

// === 核心功能代码 ===
const msgEl = document.getElementById('msg');
function showMsg(txt) { msgEl.innerText = txt; }

window.switchTab = function(tabId, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-' + tabId).classList.add('active');
  
  document.getElementById('c2d').style.display = (tabId === 'graph') ? 'block' : 'none';
  document.getElementById('c3d').style.display = (tabId === '3d') ? 'block' : 'none';
  
  resizeAll();
  if(tabId === 'graph') draw2D();
  if(tabId === '3d') draw3D();
};

window.insertStr = function(id, str) {
  const el = document.getElementById(id);
  const start = el.selectionStart, end = el.selectionEnd;
  el.value = el.value.substring(0, start) + str + el.value.substring(end);
  el.selectionStart = el.selectionEnd = start + str.length;
  el.focus();
  if (id === 'expr2d') { updateSliders(); draw2D(); }
};

function preprocess(str) {
  let s = str;
  s = s.replace(/（/g, '(').replace(/）/g, ')').replace(/，/g, ',');
  s = s.replace(/×/g, '*').replace(/÷/g, '/').replace(/π/g, 'PI');
  s = s.replace(/\bln\(/g, 'log(').replace(/\blg\(/g, 'log10(');
  s = s.replace(/(\d)([a-zA-Z\(])/g, '$1*$2');
  s = s.replace(/(\))(\d|[a-zA-Z])/g, '$1*$2');
  s = s.replace(/\b(sin|cos|tan|sqrt|log|abs)\s+([a-zA-Z0-9]+)\b/g, '$1($2)');
  s = s.replace(/\^/g, '**');
  return s;
}

// ==========================================
// 1. 2D 画板逻辑
// ==========================================
const c2d = document.getElementById('c2d');
const ctx2d = c2d.getContext('2d');
const expr2dEl = document.getElementById('expr2d');
const sliders2dContainer = document.getElementById('sliders2d');
const COLORS = ['#007aff','#ff3b30','#34c759','#ff9500','#af52de','#5ac8fa','#ff2d55','#8e8e93','#00c7be','#ffcc00'];

let unitX = 60, unitY = 60, ox = 0, oy = 0;
let paramValues = { a: 1, b: 0, c: 1, k: 1 };

function compile2D(expr) {
  const src = preprocess(expr);
  return new Function('x', 'p', `with(Math){ 
    const a = p.a || 1, b = p.b || 0, c = p.c || 1, k = p.k || 1;
    return (${src}); 
  }`);
}

function extractParams(expr) {
  const matches = expr.match(/[a-zA-Z]+/g) || [];
  const p = new Set();
  const exclude = ['x', 'e', 'pi', 'sin', 'cos', 'tan', 'sqrt', 'abs', 'log', 'log10', 'exp'];
  matches.forEach(m => { if (!exclude.includes(m.toLowerCase()) && m.length === 1) p.add(m.toLowerCase()); });
  return Array.from(p);
}

function updateSliders() {
  const lines = expr2dEl.value.split('\n');
  let allParams = new Set();
  lines.forEach(line => { extractParams(line).forEach(p => allParams.add(p)); });
  const current = Array.from(sliders2dContainer.querySelectorAll('.slider-row')).map(el => el.dataset.param);
  const next = Array.from(allParams).sort();
  if (current.join(',') === next.join(',')) return;

  sliders2dContainer.innerHTML = '';
  next.forEach(p => {
    if (paramValues[p] === undefined) paramValues[p] = 1;
    const row = document.createElement('div');
    row.className = 'slider-row';
    row.dataset.param = p;
    row.innerHTML = `<div class="slider-label">${p}</div>
      <input type="range" min="-10" max="10" step="0.1" value="${paramValues[p]}" oninput="handleSlider('${p}', this.value)">
      <div class="slider-val" id="val-${p}">${paramValues[p].toFixed(1)}</div>`;
    sliders2dContainer.appendChild(row);
  });
}
window.handleSlider = function(p, val) {
  paramValues[p] = parseFloat(val);
  document.getElementById('val-' + p).textContent = paramValues[p].toFixed(1);
  draw2D();
};

function draw2D() {
  updateSliders();
  const W = innerWidth, H = innerHeight;
  ctx2d.clearRect(0, 0, W, H);
  if (ox === 0 && oy === 0) { ox = W / 2; oy = H / 2; }

  const step = 60;
  ctx2d.strokeStyle = 'rgba(0,0,0,0.06)';
  for(let x = ox % step; x < W; x += step) { ctx2d.beginPath(); ctx2d.moveTo(x, 0); ctx2d.lineTo(x, H); ctx2d.stroke(); }
  for(let y = oy % step; y < H; y += step) { ctx2d.beginPath(); ctx2d.moveTo(0, y); ctx2d.lineTo(W, y); ctx2d.stroke(); }
  
  ctx2d.strokeStyle = 'rgba(0,0,0,0.3)'; ctx2d.lineWidth = 1.5;
  ctx2d.beginPath(); ctx2d.moveTo(0, oy); ctx2d.lineTo(W, oy); ctx2d.stroke();
  ctx2d.beginPath(); ctx2d.moveTo(ox, 0); ctx2d.lineTo(ox, H); ctx2d.stroke();

  const dMin = parseFloat(document.getElementById('dom-min').value);
  const dMax = parseFloat(document.getElementById('dom-max').value);
  const rMin = parseFloat(document.getElementById('ran-min').value);
  const rMax = parseFloat(document.getElementById('ran-max').value);

  const toSX = x => ox + x * unitX;
  const toSY = y => oy - y * unitY;

  const lines = expr2dEl.value.split('\n').filter(s => s.trim() !== '');
  let parsedFuncs = [];
  let errors = [];

  lines.forEach((line, idx) => {
    let s = line.replace(/^y\s*=\s*/i, '').replace(/^f\s*\(\s*x\s*\)\s*=\s*/i, '').trim();
    if(!s) return;
    try {
      const f = compile2D(s);
      parsedFuncs.push({ f, color: COLORS[idx % COLORS.length], expr: line });
    } catch(e) { errors.push(`第${idx+1}行错`); }
  });

  const curvesData = [];
  parsedFuncs.forEach((func, i) => {
    ctx2d.strokeStyle = func.color;
    ctx2d.lineWidth = 2.5;
    ctx2d.beginPath();
    let pen = false;
    let points = [];

    for (let px = 0; px <= W; px += 1) {
      const x = (px - ox) / unitX;
      if (!isNaN(dMin) && x < dMin) { pen = false; continue; }
      if (!isNaN(dMax) && x > dMax) { pen = false; continue; }

      let y; 
      try { y = func.f(x, paramValues); } catch(e) { y = NaN; }
      
      if (!isFinite(y) || (!isNaN(rMin) && y < rMin) || (!isNaN(rMax) && y > rMax)) {
        pen = false; points.push(null); continue; 
      }

      points.push({ x, y });
      const py = toSY(y);
      if (py < -500 || py > H + 500) { pen = false; continue; }
      if (!pen) { ctx2d.moveTo(px, py); pen = true; } else { ctx2d.lineTo(px, py); }
    }
    ctx2d.stroke();
    curvesData.push(points);
  });

  if (curvesData.length >= 2) {
    ctx2d.fillStyle = '#000';
    ctx2d.font = 'bold 13px monospace';
    ctx2d.textAlign = 'left';
    
    for (let i = 0; i < curvesData.length; i++) {
      for (let j = i + 1; j < curvesData.length; j++) {
        const c1 = curvesData[i], c2 = curvesData[j];
        let intersections = [];
        
        for (let k = 1; k < Math.min(c1.length, c2.length); k++) {
          if (c1[k] && c2[k] && c1[k-1] && c2[k-1]) {
            const diff1 = c1[k-1].y - c2[k-1].y;
            const diff2 = c1[k].y - c2[k].y;
            if (diff1 * diff2 <= 0) {
              const ratio = Math.abs(diff1) / (Math.abs(diff1) + Math.abs(diff2));
              const ix = c1[k-1].x + ratio * (c1[k].x - c1[k-1].x);
              const iy = c1[k-1].y + ratio * (c1[k].y - c1[k-1].y);
              if (!intersections.some(pt => Math.abs(pt.x - ix) < 0.5)) {
                intersections.push({ x: ix, y: iy });
              }
            }
          }
        }

        intersections.forEach(pt => {
          const sx = toSX(pt.x), sy = toSY(pt.y);
          if (sx >= 0 && sx <= W && sy >= 0 && sy <= H) {
            ctx2d.beginPath();
            ctx2d.arc(sx, sy, 5, 0, Math.PI * 2);
            ctx2d.fillStyle = '#fff';
            ctx2d.fill();
            ctx2d.strokeStyle = '#000';
            ctx2d.lineWidth = 2;
            ctx2d.stroke();
            ctx2d.fillStyle = '#000';
            ctx2d.fillText(`(${pt.x.toFixed(2)}, ${pt.y.toFixed(2)})`, sx + 8, sy - 8);
          }
        });
      }
    }
  }
  showMsg(errors.length ? errors[0] : `已绘制 ${parsedFuncs.length} 条函数`);
}

let mode2d = null, last2d = null, pinch2d = null;
let raf2d = 0;
function scheduleDraw2D() {
  if (raf2d) return;
  raf2d = requestAnimationFrame(() => { raf2d = 0; draw2D(); });
}

c2d.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    mode2d = 'pan';
    last2d = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    pinch2d = null;
  } else if (e.touches.length === 2) {
    mode2d = 'pinch';
    last2d = null;
    const [a, b] = e.touches;
    pinch2d = { dist: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), cx: (a.clientX + b.clientX) / 2, cy: (a.clientY + b.clientY) / 2 };
  }
}, { passive: false });

c2d.addEventListener('touchmove', e => {
  e.preventDefault();
  if (mode2d === 'pan' && e.touches.length === 1) {
    const t = e.touches[0];
    ox += t.clientX - last2d.x;
    oy += t.clientY - last2d.y;
    last2d = { x: t.clientX, y: t.clientY };
    scheduleDraw2D();
  }
  if (mode2d === 'pinch' && e.touches.length === 2) {
    const [a, b] = e.touches;
    const nd = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    const ncx = (a.clientX + b.clientX) / 2;
    const ncy = (a.clientY + b.clientY) / 2;
    const s = nd / pinch2d.dist;
    ox = ncx + (ox - pinch2d.cx) * s;
    oy = ncy + (oy - pinch2d.cy) * s;
    unitX = Math.min(Math.max(unitX * s, 1e-3), 1e6);
    unitY = Math.min(Math.max(unitY * s, 1e-3), 1e6);
    ox += ncx - pinch2d.cx;
    oy += ncy - pinch2d.cy;
    pinch2d = { dist: nd, cx: ncx, cy: ncy };
    scheduleDraw2D();
  }
}, { passive: false });

c2d.addEventListener('touchend', e => {
  if (e.touches.length === 0) { mode2d = null; last2d = null; pinch2d = null; }
  else if (e.touches.length === 1) {
    mode2d = 'pan'; pinch2d = null;
    last2d = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
});
c2d.addEventListener('touchcancel', () => { mode2d = null; last2d = null; pinch2d = null; });


// ==========================================
// 2. 3D 曲面引擎
// ==========================================
const c3d = document.getElementById('c3d');
const ctx3d = c3d.getContext('2d');
let rotX = -0.5, rotY = 0.5, zoom3d = 1;
let isDragging3d = false, lastX3d = 0, lastY3d = 0, pinchDist3d = 0;

function project(x, y, z) {
  let x1 = x * Math.cos(rotY) - z * Math.sin(rotY);
  let z1 = x * Math.sin(rotY) + z * Math.cos(rotY);
  let y1 = y * Math.cos(rotX) - z1 * Math.sin(rotX);
  let z2 = y * Math.sin(rotX) + z1 * Math.cos(rotX);
  const fov = 500 * zoom3d;
  const scale = fov / (fov + z2);
  return { x: innerWidth / 2 + x1 * scale * 40, y: innerHeight / 2 - y1 * scale * 40, depth: z2 };
}

function draw3D() {
  const W = innerWidth, H = innerHeight;
  ctx3d.clearRect(0, 0, W, H);
  const expr = document.getElementById('expr3d').value.replace(/^z\s*=\s*/i, '').trim();
  if(!expr) return;
  
  let f;
  try {
    f = new Function('x', 'y', `with(Math){ return (${preprocess(expr)}); }`);
  } catch(e) { showMsg("3D表达式错误"); return; }

  const N = 25, size = 5, step = (size * 2) / N;
  const points = [];
  for(let i=0; i<=N; i++) {
    points[i] = [];
    for(let j=0; j<=N; j++) {
      const x = -size + i * step;
      const y = -size + j * step;
      let z = 0;
      try { z = f(x, y); } catch(e) { z = 0; }
      if(!isFinite(z)) z = 0;
      z = Math.max(-10, Math.min(10, z));
      points[i][j] = project(x, z, y);
    }
  }

  ctx3d.lineWidth = 1;
  ctx3d.strokeStyle = 'rgba(0,122,255,0.4)';
  for(let i=0; i<=N; i++) {
    ctx3d.beginPath();
    for(let j=0; j<=N; j++) {
      const p = points[i][j];
      if(j===0) ctx3d.moveTo(p.x, p.y); else ctx3d.lineTo(p.x, p.y);
    }
    ctx3d.stroke();
  }
  for(let j=0; j<=N; j++) {
    ctx3d.beginPath();
    for(let i=0; i<=N; i++) {
      const p = points[i][j];
      if(i===0) ctx3d.moveTo(p.x, p.y); else ctx3d.lineTo(p.x, p.y);
    }
    ctx3d.stroke();
  }

  const origin = project(0,0,0), ax = project(6,0,0), ay = project(0,6,0), az = project(0,0,6);
  ctx3d.lineWidth = 2;
  ctx3d.strokeStyle = '#ff3b30'; ctx3d.beginPath(); ctx3d.moveTo(origin.x, origin.y); ctx3d.lineTo(ax.x, ax.y); ctx3d.stroke();
  ctx3d.strokeStyle = '#34c759'; ctx3d.beginPath(); ctx3d.moveTo(origin.x, origin.y); ctx3d.lineTo(ay.x, ay.y); ctx3d.stroke();
  ctx3d.strokeStyle = '#007aff'; ctx3d.beginPath(); ctx3d.moveTo(origin.x, origin.y); ctx3d.lineTo(az.x, az.y); ctx3d.stroke();
  
  showMsg("3D 曲面已生成");
}

function reset3D() { rotX = -0.5; rotY = 0.5; zoom3d = 1; draw3D(); }

c3d.addEventListener('touchstart', e => {
  if(e.touches.length === 1) {
    isDragging3d = true;
    lastX3d = e.touches[0].clientX;
    lastY3d = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    pinchDist3d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  }
}, {passive: false});

c3d.addEventListener('touchmove', e => {
  e.preventDefault();
  if(isDragging3d && e.touches.length === 1) {
    const dx = e.touches[0].clientX - lastX3d;
    const dy = e.touches[0].clientY - lastY3d;
    rotY -= dx * 0.01;
    rotX -= dy * 0.01;
    rotX = Math.max(-Math.PI/2.1, Math.min(Math.PI/2.1, rotX));
    lastX3d = e.touches[0].clientX;
    lastY3d = e.touches[0].clientY;
    draw3D();
  } else if(e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    zoom3d *= d / pinchDist3d;
    zoom3d = Math.max(0.2, Math.min(zoom3d, 5));
    pinchDist3d = d;
    draw3D();
  }
}, {passive: false});

c3d.addEventListener('touchend', () => { isDragging3d = false; });


// ==========================================
// 3. 计算器 & 余数模块
// ==========================================
let calcExpr = '';
const calcScreen = document.getElementById('calc-screen');
window.calcInput = v => {
  if(v === 'C') { calcExpr = ''; calcScreen.innerText = '0'; return; }
  calcExpr += v; calcScreen.innerText = calcExpr;
};
window.calcEquals = () => {
  try {
    let res = new Function('with(Math){ return (' + calcExpr + ') }')();
    res = Math.round(res * 1e10) / 1e10;
    calcScreen.innerText = res; calcExpr = res.toString();
  } catch(e) { calcScreen.innerText = '错误'; calcExpr = ''; }
};
window.calcMod = () => {
  const d = parseFloat(document.getElementById('mod-dividend').value) || 0;
  const v = parseFloat(document.getElementById('mod-divisor').value) || 1;
  document.getElementById('mod-q').innerText = Math.floor(d / v);
  document.getElementById('mod-r').innerText = Math.round((d % v) * 1e10) / 1e10;
};
window.setMod = v => { document.getElementById('mod-divisor').value = v; calcMod(); };

// ==========================================
// 初始化
// ==========================================
function resizeAll() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  [c2d, c3d].forEach(canvas => {
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    canvas.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  });
  if(document.getElementById('tab-graph').classList.contains('active')) draw2D();
  if(document.getElementById('tab-3d').classList.contains('active')) draw3D();
}

document.getElementById('drawBtn').onclick = draw2D;
document.getElementById('resetBtn').onclick = () => { ox = innerWidth/2; oy = innerHeight/2; unitX = 60; unitY = 60; draw2D(); };
document.getElementById('draw3dBtn').onclick = draw3D;
expr2dEl.addEventListener('input', updateSliders);

window.addEventListener('resize', resizeAll);
resizeAll();
calcMod();
</script>
